[project]
name = "survey-ai-agent"
version = "0.1.0"
description = "AI survey analysis and answering service (PydanticAI + DeepSeek + MySQL)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.5",
  "pydantic-ai-slim[openai]>=2.65,<3",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "PyMySQL>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
py-modules = []
